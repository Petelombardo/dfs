[package]
name = "dfs-client"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[dependencies]
dfs-common = { path = "../dfs-common" }
tokio = { workspace = true }
fuser = { workspace = true }
libc = { workspace = true }
serde = { workspace = true }
bincode = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-appender = { workspace = true }
clap = { workspace = true }
blake3 = { workspace = true }
uuid = { workspace = true }
lru = "0.12"
quick_cache = "0.6"
futures = "0.3"
dashmap = "6.1"
arc-swap = "1"
mimalloc = "0.1"

[dev-dependencies]
# test-util enables tokio's pausable virtual clock (tokio::time::pause/advance,
# #[tokio::test(start_paused = true)]) for deterministic timeout tests without real
# waits. NOT in the "full" feature set (it alters runtime timing), and test-only, so
# it has no effect on the production binary.
tokio = { workspace = true, features = ["test-util"] }
