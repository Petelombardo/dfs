[workspace]
members = [
    "dfs-common",
    "dfs-server",
    "dfs-client",
    "dfs-admin",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["DFS Contributors"]
license = "MIT"

[workspace.dependencies]
# Async runtime
tokio = { version = "1.42", features = ["full"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"
toml = "0.8"

# Embedded database
redb = "2"

# Hashing and crypto
# "rayon" enables multi-threaded hashing for large inputs (Hasher::update_rayon) —
# every chunk patch re-hashes the full chunk (content-addressed storage), and on
# the modest ARM SBCs this cluster runs on, single-threaded BLAKE3 only hits
# ~210MB/s (~19ms per 4MB chunk). Parallelizing across cores measured ~3.7x
# faster (~775MB/s, ~5ms per 4MB chunk) — see compute_chunk_hash_at.
blake3 = { version = "1.5", features = ["rayon"] }
sha2 = "0.10"

# Networking
bytes = "1.9"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"

# Error handling
anyhow = "1.0"
thiserror = "2.0"

# CLI
clap = { version = "4.5", features = ["derive"] }

# FUSE
fuser = "0.16"
libc = "0.2"

# Allocator
tikv-jemallocator = "0.6"

# Utilities
uuid = { version = "1.11", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
